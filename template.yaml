AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  API movil de AppFibra (ADR-019). GET /v1/yo/carpetas para FotosObra y
  GET /v1/direccion/... para la app de KPI, con token de Entra ID.
  AppFibra publica en DynamoDB; las Lambda solo leen.

# CloudFormation es el inventario de lo que existe en AWS.
# Este fichero lo describe entero: si se borra la pila, se borra todo lo de aqui.
# "Transform: AWS::Serverless-2016-10-31" activa SAM, que traduce los tipos
# AWS::Serverless::* a los recursos largos de CloudFormation.

# Valores que se repiten en todas las funciones.
# Valores que cambian entre entornos. Se sobrescriben al desplegar con
# --parameter-overrides, sin tocar el fichero.
Parameters:
  TenantId:
    Type: String
    Default: 68c7939c-d7c1-4a03-86b4-827f15fcd06d
    Description: Inquilino de Entra ID de INSYTE
  ApiAppId:
    Type: String
    Default: 78d4dbf7-fb0e-4677-9c1e-95f046dddbff
    Description: Id de aplicacion del registro "FotosObra API" en Entra ID
  CorreoAvisos:
    Type: String
    Default: rsamadi@insytesoluciones.es
    Description: "Donde llegan las alarmas. Vacio: se crea el tema pero sin destinatario"

Conditions:
  HayCorreo: !Not [!Equals [!Ref CorreoAvisos, ""]]

Globals:
  Function:
    Runtime: python3.12
    # arm64 (Graviton) cuesta un 20% menos que x86_64 por la misma ejecucion.
    Architectures:
      - arm64
    # 128 MB es el minimo. El precio de Lambda se cobra por GB y segundo:
    # mas memoria es mas caro por segundo, pero tambien mas CPU.
    MemorySize: 128
    # Segundos antes de cortar la ejecucion. Una lectura de DynamoDB tarda
    # milisegundos; 5 segundos solo sirve de red de seguridad.
    Timeout: 5
    Environment:
      Variables:
        # Las variables de entorno llegan a Python en os.environ.
        ENTORNO: desarrollo

Resources:

  # La URL publica. Un HTTP API es la version barata y sencilla de API Gateway:
  # ~1 $ por millon de peticiones, sin coste fijo.
  # En la etapa 3 se le añade aqui el autorizador JWT de Entra ID.
  ApiMovil:
    Type: AWS::Serverless::HttpApi
    Properties:
      # El nombre de la etapa es el primer tramo de la ruta publica:
      # https://<id>.execute-api.eu-central-1.amazonaws.com/v1/yo/carpetas
      StageName: v1
      # Techo de peticiones para toda la API. No es por usuario: es el total.
      # Una app que se vuelva loca, o alguien probando, no puede disparar la
      # factura ni tumbar el servicio: a partir de aqui la API responde 429.
      DefaultRouteSettings:
        ThrottlingRateLimit: 20
        ThrottlingBurstLimit: 50
      Auth:
        # Se aplica a todas las rutas. Una ruta abierta tendria que pedirlo
        # explicitamente con Auth: Authorizer: NONE.
        DefaultAuthorizer: EntraId
        Authorizers:
          EntraId:
            # De donde sale el token: cabecera "Authorization: Bearer <token>".
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              # Quien lo emitio. API Gateway descarga de esta direccion las
              # claves publicas de Microsoft y con ellas comprueba la firma.
              # Tiene que coincidir letra por letra con el claim iss del token:
              # esta forma con /v2.0 exige requestedAccessTokenVersion = 2 en
              # el manifiesto del registro de la API.
              issuer: !Sub "https://login.microsoftonline.com/${TenantId}/v2.0"
              # A quien va dirigido, el claim aud. Se aceptan las dos formas
              # porque Entra usa el GUID en los tokens v2 y el api://<guid> en
              # los v1, y las dos identifican al mismo registro.
              audience:
                - !Ref ApiAppId
                - !Sub "api://${ApiAppId}"

  # La tabla donde AppFibra deja las carpetas de cada tecnico.
  TablaCarpetas:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fotosobra-carpetas
      # Se paga por peticion, no por capacidad reservada. Sin trafico, cero.
      BillingMode: PAY_PER_REQUEST
      # Solo se declaran los atributos que forman la clave. El resto del
      # contenido de cada fila es libre: DynamoDB no tiene esquema.
      AttributeDefinitions:
        - AttributeName: persona
          AttributeType: S
      KeySchema:
        - AttributeName: persona
          KeyType: HASH

  # Las cifras de produccion para la app de KPI. Una fila por "vista":
  # avance#UGG es el cliente entero, avance#UGG#KOELN una ciudad. AppFibra
  # la reescribe entera una vez al dia, al terminar su refresco de las 08:00.
  # Cada fila guarda el JSON en el atributo "datos", que la Lambda devuelve
  # tal cual: el formato lo decide AppFibra, no esta plantilla.
  TablaDireccionResumen:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: direccion-resumen
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: vista
          AttributeType: S
      KeySchema:
        - AttributeName: vista
          KeyType: HASH

  # Quien puede usar la app de KPI y que ve. Lo decide AppFibra con sus
  # permisos y lo publica aqui: una fila por persona (oid o correo) con los
  # clientes y, de cada uno, "*" (todo) o la lista de ciudades o proyectos.
  # El token de Entra lo tiene cualquier persona del tenant, tambien los
  # tecnicos de las subcontratas: sin fila en esta tabla, la API responde 403.
  TablaDireccionAcceso:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: direccion-acceso
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: persona
          AttributeType: S
      KeySchema:
        - AttributeName: persona
          KeyType: HASH

  # La identidad con la que AppFibra escribe desde el servidor de la oficina.
  # Solo escribe y borra filas de esta tabla: no puede leerlas, ni listar la
  # tabla, ni tocar nada mas de la cuenta.
  # Las claves de acceso no se crean aqui: se crean a mano en la consola para
  # que el secreto no acabe en la plantilla ni en CloudFormation.
  UsuarioPublicador:
    Type: AWS::IAM::User
    Properties:
      UserName: appfibra-fotosobra-publicador
      Policies:
        - PolicyName: escribir-carpetas
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                Resource: !GetAtt TablaCarpetas.Arn
        # Una politica aparte para la app de KPI. Las mismas claves de acceso
        # sirven para las tres tablas: AppFibra no necesita un segundo secreto.
        - PolicyName: escribir-direccion
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt TablaDireccionResumen.Arn
                  - !GetAtt TablaDireccionAcceso.Arn

  # El codigo que responde a la ruta.
  CarpetasFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Carpeta que se empaqueta y se sube. Todo lo que haya dentro viaja.
      CodeUri: src/carpetas/
      # "fichero.funcion": app.py, funcion lambda_handler.
      Handler: app.lambda_handler
      Environment:
        Variables:
          # El nombre real de la tabla, para no escribirlo en el codigo.
          TABLA_CARPETAS: !Ref TablaCarpetas
      # Sin esto, Lambda crea su propio grupo de registros y lo guarda para
      # siempre. Los registros llevan el oid del tecnico: son datos personales
      # y la retencion acordada con el delegado es de 30 dias.
      LoggingConfig:
        LogGroup: !Ref RegistroCarpetas
      # Permisos del rol de la funcion. Solo leer una fila, y solo de esta
      # tabla. Ni Scan, ni escritura, ni las demas tablas de la cuenta.
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt TablaCarpetas.Arn
      Events:
        # Cada Event es una razon por la que AWS ejecuta esta funcion.
        # Aqui solo hay una: que llegue un GET a esa ruta.
        Carpetas:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiMovil
            Path: /yo/carpetas
            Method: GET

  RegistroCarpetas:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/api-movil-carpetas
      RetentionInDays: 30

  # Las rutas de la app de KPI. Una sola funcion para las tres: comparten la
  # comprobacion de acceso, que es la parte que importa.
  DireccionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/direccion/
      Handler: app.lambda_handler
      # El item de UGG ocupa unos 130 KB. Con 128 MB la funcion tarda mas en
      # leerlo y convertirlo; con 256 MB tiene el doble de CPU.
      MemorySize: 256
      Environment:
        Variables:
          TABLA_RESUMEN: !Ref TablaDireccionResumen
          TABLA_ACCESO: !Ref TablaDireccionAcceso
      LoggingConfig:
        LogGroup: !Ref RegistroDireccion
      # Solo leer filas sueltas de sus dos tablas.
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource:
                - !GetAtt TablaDireccionResumen.Arn
                - !GetAtt TablaDireccionAcceso.Arn
      Events:
        # Que puede ver quien llama: clientes y ciudades o proyectos.
        Yo:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiMovil
            Path: /direccion/yo
            Method: GET
        # {cliente} es un parametro de ruta: API Gateway acepta cualquier
        # valor en ese tramo y se lo pasa a la funcion en pathParameters.
        AvanceCliente:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiMovil
            Path: /direccion/avance/{cliente}
            Method: GET
        AvanceAmbito:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiMovil
            Path: /direccion/avance/{cliente}/{ambito}
            Method: GET

  RegistroDireccion:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/api-movil-direccion
      RetentionInDays: 30

  # Donde llegan las alarmas. El correo tiene que confirmar la suscripcion
  # pulsando el enlace que manda AWS: hasta entonces no recibe nada.
  Avisos:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: api-movil-avisos

  SuscripcionAvisos:
    Type: AWS::SNS::Subscription
    Condition: HayCorreo
    Properties:
      TopicArn: !Ref Avisos
      Protocol: email
      Endpoint: !Ref CorreoAvisos

  # El codigo ha fallado. Una sola vez ya es motivo de mirar: con este
  # volumen, los errores no son ruido de fondo.
  AlarmaErrores:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: api-movil-errores-lambda
      AlarmDescription: La funcion de carpetas ha fallado
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CarpetasFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref Avisos

  AlarmaErroresDireccion:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: api-movil-errores-direccion
      AlarmDescription: La funcion de la app de KPI ha fallado
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DireccionFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref Avisos

  # La API devuelve 5xx: algo esta roto entre API Gateway y la funcion.
  AlarmaFallosApi:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: api-movil-5xx
      AlarmDescription: La API responde con errores de servidor
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref ApiMovil
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref Avisos

  # Trafico muy por encima de lo normal. Con unos cientos de tecnicos, 2000
  # peticiones en cinco minutos no es uso: es un bucle o alguien probando.
  AlarmaTrafico:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: api-movil-trafico
      AlarmDescription: Peticiones muy por encima de lo esperado
      Namespace: AWS/ApiGateway
      MetricName: Count
      Dimensions:
        - Name: ApiId
          Value: !Ref ApiMovil
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref Avisos

Outputs:
  # La base es lo que se configura en la app. Las rutas se le pegan detras.
  # El identificador del API lo genera AWS al crearlo: si se borra la pila y
  # se vuelve a crear, cambia. Por eso no se escribe en el codigo de la app.
  UrlBase:
    Description: Base de la API. Las rutas cuelgan de aqui
    Value: !Sub "https://${ApiMovil}.execute-api.${AWS::Region}.amazonaws.com/v1"
  EjemploDeRuta:
    Description: Una ruta concreta, para comprobar que responde
    Value: !Sub "https://${ApiMovil}.execute-api.${AWS::Region}.amazonaws.com/v1/yo/carpetas"
